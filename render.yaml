services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: ADMIN_TOKEN
        value: admin-secret-token
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: seat-reservation-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: seat-reservation-db
          property: password

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
